# OFFR Rewards — Render Blueprint, PAID path (persistent disk + SQLite).
#
# A persistent disk requires a paid instance type, so Render will ask for a card.
# If you need a card-free deployment, use render.yaml (Render free instance +
# free Postgres) or vercel.json (Vercel Hobby + Neon), both documented in
# docs/DEPLOYMENT-FREE.md.
#
# One web service running Next.js in front of SQLite on a persistent disk.
# Every value below is taken from package.json, src/lib/env.ts and
# docs/DEPLOYMENT.md — nothing here is invented.
#
# Usage: Render Dashboard → New → Blueprint → pick this repo → apply.
# Secrets are left as `sync: false`, which makes Render prompt for them once and
# store them encrypted. Never put a secret value in this file or in git.

services:
  - type: web
    name: offr-rewards
    runtime: node
    plan: starter # a persistent disk requires a paid instance type
    region: oregon
    branch: main
    autoDeploy: false # deploy deliberately; flip on after the first green smoke test
    # --include=optional : better-sqlite3 is an optional dependency; without it npm
    #                      silently skips the driver and every page returns 500.
    # --ignore-scripts   : better-sqlite3 13 ships a prebuilt binary for this platform
    #                      and its `node-gyp rebuild` script fails wherever the Node
    #                      headers are unreachable — npm then DROPS the optional
    #                      package without an error. Verified: this combination yields
    #                      a working driver from a clean checkout.
    # node -e require(...) : hard stop if the driver is missing, instead of shipping a
    #                      deploy whose every page 500s.
    buildCommand: npm ci --include=optional --ignore-scripts && node -e "require('better-sqlite3')" && npm run build
    # `next start` binds 0.0.0.0:$PORT and sets NODE_ENV=production itself.
    # Migrations apply automatically on first DB access (src/lib/db/index.ts).
    startCommand: npm start
    healthCheckPath: /api/health

    disk:
      name: offr-data
      mountPath: /var/data # must match SQLITE_PATH below
      sizeGB: 1

    envVars:
      # ── runtime ────────────────────────────────────────────────────────────
      - key: NODE_VERSION
        value: 22.14.0
      - key: SQLITE_PATH
        value: /var/data/offr.db
      - key: DATABASE_URL # leave unset to use SQLite; set to a Postgres URL only if switching engines
        sync: false

      # ── public URL (cookies are Secure-only in production) ────────────────
      - key: NEXT_PUBLIC_APP_URL
        sync: false # e.g. https://offr.world

      # ── Base mainnet, read-only ───────────────────────────────────────────
      - key: CHAIN_MODE
        value: live
      - key: BASE_RPC_URL
        sync: false # public https://mainnet.base.org works, a paid RPC is faster and more reliable
      - key: TOKEN_DECIMALS
        sync: false # leave EMPTY so decimals are read from the contract

      # ── bootstrap admin (rotate, then delete both) ────────────────────────
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # ── optional integrations: unset = documented degraded mode ───────────
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true # Render generates a long random secret; pass the same value to setWebhook
      - key: X_BEARER_TOKEN
        sync: false
      - key: TEAM_WALLET_ADDRESS
        sync: false

      # ── reverse proxy / rate limiting ─────────────────────────────────────
      # RENDER is set by the platform, so TRUST_PROXY auto-enables (src/lib/env.ts).
      - key: ADMIN_SESSION_HOURS
        value: 8
